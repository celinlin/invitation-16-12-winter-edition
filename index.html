<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Votre invitation — Intertech Talents</title>
  <meta name="description" content="Invitation personnelle — Intertech Talents, Paris, mercredi 16 décembre 2026.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b0a72">
  <meta property="og:title" content="Une invitation vous attend — Intertech Talents">
  <meta property="og:description" content="Paris · 16.12 — Le social club des top tech operators et founders.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fond vaporeux et à grains (charte : « à privilégier ») -->
  <div class="atmosphere" aria-hidden="true">
    <span class="glow glow--a"></span>
    <span class="glow glow--b"></span>
    <span class="glow glow--c"></span>
    <span class="grain"></span>
  </div>

  <a class="brandmark" href="https://intertech-talents.com/" aria-label="Intertech Talents — site officiel" data-logo></a>

  <main>
    <!-- ============ SCÈNE : L'ENVELOPPE ============ -->
    <section class="scene" id="scene" aria-label="Votre invitation">
      <div class="env-stage" id="envStage">
        <div class="env-tilt" id="envTilt">
          <div class="envelope" id="envelope">
            <span class="env-shadow" aria-hidden="true"></span>

            <!-- Fond intérieur de l'enveloppe -->
            <div class="env-back" aria-hidden="true">
              <svg class="liner" viewBox="0 0 100 70" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="linerGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#4d61f4"/>
                    <stop offset="1" stop-color="#280f91"/>
                  </linearGradient>
                </defs>
                <rect width="100" height="70" fill="url(#linerGrad)"/>
              </svg>
            </div>

            <!-- La carte -->
            <article class="card" id="card" aria-labelledby="guestName">
              <div class="card-grain" aria-hidden="true"></div>
              <svg class="card-ornament" aria-hidden="true" viewBox="0 0 200 200">
                <defs>
                  <linearGradient id="ornA" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f6a95f"/>
                    <stop offset="1" stop-color="#f6a95f" stop-opacity="0"/>
                  </linearGradient>
                  <linearGradient id="ornB" x1="1" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#4d61f4"/>
                    <stop offset="1" stop-color="#8bacfa" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path d="M200 0 A200 200 0 0 0 0 200 L40 200 A160 160 0 0 1 200 40 Z" fill="url(#ornB)" opacity=".55"/>
                <path d="M200 60 A140 140 0 0 0 60 200 L92 200 A108 108 0 0 1 200 92 Z" fill="url(#ornA)"/>
                <path d="M200 116 A84 84 0 0 0 116 200 L200 200 Z" fill="url(#ornB)" opacity=".8"/>
              </svg>

              <!-- Film holographique (couleurs de la charte) -->
              <div class="holo" aria-hidden="true"><span class="holo-lines"></span><span class="holo-glare"></span></div>

              <!-- Recto visible dans l'enveloppe -->
              <div class="cover" aria-hidden="true">
                <span class="cover-eyebrow" data-bind="event.eyebrow"></span>
                <span class="cover-name" data-bind="guest.prenomOrGeneric"></span>
                <span class="cover-title" data-bind="event.title"></span>
                <span class="cover-logo" data-logo></span>
                <span class="cover-code" data-bind="guest.code"></span>
              </div>

              <!-- Invitation complète -->
              <div class="full" id="full">
                <header class="full-head reveal">
                  <span class="full-logo" data-logo></span>
                  <span class="full-code"><span class="dot-live" aria-hidden="true"></span><span data-bind="guest.code"></span></span>
                </header>

                <div class="full-hero">
                  <p class="kicker reveal" data-bind="event.eyebrow"></p>
                  <h1 class="guest-name reveal" id="guestName" tabindex="-1" data-bind="guest.fullName"></h1>
                  <p class="event-title reveal" data-bind="event.title"></p>
                  <p class="lede reveal" data-bind="defaults.intro"></p>
                  <a class="hero-cta reveal" id="heroCta" href="#" target="_blank" rel="noopener">
                    <span data-bind="rsvp.heroLabel"></span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </a>
                </div>

                <div class="duo">
                  <section class="duo-col reveal">
                    <h2 class="label">Pourquoi vous</h2>
                    <p data-bind="guest.why"></p>
                  </section>
                  <section class="duo-col reveal">
                    <h2 class="label">Ce qui vous attend</h2>
                    <p data-bind="guest.awaits"></p>
                  </section>
                </div>

                <dl class="facts reveal">
                  <div class="fact">
                    <dt class="label">Date</dt>
                    <dd class="fact-main" data-bind="event.dateLong"></dd>
                  </div>
                  <div class="fact">
                    <dt class="label">Lieu</dt>
                    <dd class="fact-main" data-bind="event.place"></dd>
                    <dd class="fact-note" data-bind="event.placeNote"></dd>
                  </div>
                </dl>

                <section class="countdown reveal" id="countdown" aria-labelledby="cdTitle">
                  <h2 class="label" id="cdTitle">Ouverture des portes dans</h2>
                  <div class="cd-grid mono" role="timer" aria-live="off">
                    <span class="cd-cell"><b data-cd="d">00</b><i>jours</i></span>
                    <span class="cd-sep" aria-hidden="true">:</span>
                    <span class="cd-cell"><b data-cd="h">00</b><i>heures</i></span>
                    <span class="cd-sep" aria-hidden="true">:</span>
                    <span class="cd-cell"><b data-cd="m">00</b><i>min</i></span>
                    <span class="cd-sep" aria-hidden="true">:</span>
                    <span class="cd-cell"><b data-cd="s">00</b><i>sec</i></span>
                  </div>
                </section>

                <section class="program reveal" aria-labelledby="progTitle">
                  <h2 class="label" id="progTitle">Déroulé</h2>
                  <ol class="timeline" id="timeline"></ol>
                </section>

                <p class="stage-line reveal">
                  <span class="silhouette" aria-hidden="true"></span>
                  <span data-bind="event.stage"></span>
                </p>

                <div class="rsvp reveal">
                  <h2 class="rsvp-title" data-bind="rsvp.heading"></h2>
                  <ul class="chips" id="chips" aria-label="Informations"></ul>
                  <a class="btn" id="rsvpBtn" href="#" target="_blank" rel="noopener">
                    <span data-bind="rsvp.label"></span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </a>
                  <button class="btn-ghost" id="icsBtn" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    Ajouter au calendrier
                  </button>
                  <p class="rsvp-note"><span data-bind="rsvp.note"></span> <strong data-bind="event.noTickets"></strong></p>
                </div>

                <footer class="full-foot reveal">
                  <p class="club" data-bind="event.club"></p>
                  <div class="foot-row">
                    <p class="signature">— <span data-bind="event.signature"></span></p>
                    <button class="replay" id="replayBtn" type="button">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                      Revoir l'ouverture
                    </button>
                  </div>
                </footer>
              </div>
            </article>

            <!-- Poche avant (rabats latéraux + rabat bas) -->
            <div class="env-pocket" aria-hidden="true">
              <svg viewBox="0 0 100 70" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#3726c2"/>
                    <stop offset="1" stop-color="#4636d8"/>
                  </linearGradient>
                  <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0">
                    <stop offset="0" stop-color="#2f1fb0"/>
                    <stop offset="1" stop-color="#4233d2"/>
                  </linearGradient>
                  <linearGradient id="bottom" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0" stop-color="#3a2bc9"/>
                    <stop offset="1" stop-color="#5546e6"/>
                  </linearGradient>
                </defs>
                <path d="M0 0 L46.5 38.2 Q50 41 46.5 43.6 L0 70 Z" fill="url(#sideL)"/>
                <path d="M100 0 L53.5 38.2 Q50 41 53.5 43.6 L100 70 Z" fill="url(#sideR)"/>
                <path d="M0 70 L45 35.6 Q50 31.8 55 35.6 L100 70 Z" fill="url(#bottom)"/>
                <path d="M0 70 L45 35.6 Q50 31.8 55 35.6 L100 70" fill="none" stroke="#8bacfa" stroke-opacity=".28" stroke-width=".25" vector-effect="non-scaling-stroke"/>
              </svg>
              <span class="pocket-grain"></span>
              <div class="recipient">
                <span class="recipient-label">Pour</span>
                <span class="recipient-name" data-bind="guest.fullNameOrGeneric"></span>
              </div>
              <span class="pocket-logo" data-logo></span>
              <span class="pocket-code" data-bind="guest.code"></span>
            </div>

            <!-- Reflet qui suit le pointeur -->
            <span class="env-sheen" id="sheen" aria-hidden="true"></span>

            <!-- Cachet -->
            <span class="seal" id="seal" aria-hidden="true">
              <span class="seal-ring"></span>
              <span class="seal-mark">IT.</span>
            </span>

            <!-- Zone d'interaction accessible -->
            <button class="env-hit" id="openBtn" type="button" aria-describedby="hint">
              <span class="sr-only" data-bind="a11y.openLabel"></span>
            </button>
          </div>
        </div>
      </div>
      <p class="hint" id="hint"><span class="hint-line" aria-hidden="true"></span><span data-bind="guest.hint"></span></p>
    </section>

    <!-- ============ LECTURE : la carte vient se placer ici ============ -->
    <section class="reading" id="reading" aria-hidden="true">
      <div class="reading-slot" id="slot"></div>
    </section>

    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>

  <noscript>
    <div class="noscript">
      <p>Intertech Talents — Paris · Mercredi 16 décembre 2026</p>
      <p>18h30 ouverture des portes et networking · 19h15 fermeture des portes · 19h30 – 21h fireside chat · 21h cocktail networking, jusqu'à 23h.</p>
      <p>Activez JavaScript pour ouvrir votre invitation.</p>
    </div>
  </noscript>
